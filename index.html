<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera & QR Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h2 {
      font-size: 1.1rem;
      color: #7c83fd;
      margin: 14px 0 10px;
      text-align: center;
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      width: 100%;
      max-width: 400px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #333;
      background: transparent;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      border-color: #7c83fd;
      background: rgba(124,131,253,0.15);
      color: #7c83fd;
    }

    /* Video */
    .cam-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      display: block;
      border-radius: 16px;
    }
    canvas#overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 16px;
      display: none; /* ใช้แค่เป็น buffer ประมวลผล ไม่ต้องโชว์ */
    }

    /* QR frame */
    .qr-frame {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 200px; height: 200px;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      pointer-events: none;
    }
    .qr-frame::before, .qr-frame::after,
    .qr-frame span::before, .qr-frame span::after {
      content: '';
      position: absolute;
      width: 24px; height: 24px;
      border-color: #f59e0b;
      border-style: solid;
    }
    .qr-frame::before        { top:-3px; left:-3px;  border-width: 4px 0 0 4px; border-radius: 4px 0 0 0; }
    .qr-frame::after         { top:-3px; right:-3px; border-width: 4px 4px 0 0; border-radius: 0 4px 0 0; }
    .qr-frame span::before   { bottom:-3px; left:-3px;  border-width: 0 0 4px 4px; border-radius: 0 0 0 4px; }
    .qr-frame span::after    { bottom:-3px; right:-3px; border-width: 0 4px 4px 0; border-radius: 0 0 4px 0; }

    /* Status */
    #status {
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 10px;
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      width: 100%;
      max-width: 400px;
      min-height: 42px;
    }
    #status.ok    { border-color: #22c55e; color: #22c55e; }
    #status.error { border-color: #ef4444; color: #ef4444; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      max-width: 400px;
    }
    button.main {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.main:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-snap   { background: #fff; color: #000; }
    .btn-cancel { background: #2a2d3e; color: #aaa; }

    /* QR result box */
    #qrResult {
      display: none;
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(34,197,94,0.1);
      border: 1px solid #22c55e;
      color: #22c55e;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    /* permission guide */
    #permGuide {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #1a1d2e;
      border: 2px dashed #f59e0b;
      color: #f59e0b;
      font-size: 0.82rem;
      line-height: 1.8;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>

<h2 id="pageTitle">📷 กล้อง & สแกน QR</h2>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" id="tabPhoto" onclick="switchMode('photo')">📸 ถ่ายรูป</button>
  <button class="tab"        id="tabQR"    onclick="switchMode('qr')">🔍 สแกน QR</button>
</div>

<!-- Camera -->
<div class="cam-wrap" id="camWrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="qr-frame" id="qrFrame" style="display:none"><span></span></div>
</div>

<!-- Status -->
<div id="status">กำลังเปิดกล้อง...</div>

<!-- QR Result -->
<div id="qrResult"></div>

<!-- Buttons -->
<div class="btn-row">
  <button class="main btn-snap"   id="snapBtn"   onclick="doAction()" disabled>📸 ถ่ายรูป</button>
  <button class="main btn-cancel" id="cancelBtn" onclick="doCancel()">✕ ยกเลิก</button>
</div>

<!-- Permission Guide -->
<div id="permGuide">
  🔒 Chrome บล็อกกล้อง — วิธีแก้:<br>
  ① กดไอคอน 🔒 ที่แถบ URL ด้านบน<br>
  ② เลือก <strong>Site settings</strong><br>
  ③ หา <strong>Camera</strong> → เปลี่ยนเป็น <strong>Allow ✅</strong><br>
  ④ Reload หน้าแล้วลองใหม่
</div>

<script>
  var mode        = 'photo'; // 'photo' | 'qr'
  var stream      = null;
  var qrTimer     = null;
  var ready       = false;
  var scanning    = false;   // กันไม่ให้สแกนซ้อนกันระหว่างรอผล
  var QR_INTERVAL = 150;     // ms ระหว่างแต่ละรอบสแกน (throttle)
  var SCAN_SIZE   = 300;     // ขนาด canvas ที่ใช้สแกน (ยิ่งเล็กยิ่งเร็ว)

  // ตรวจสอบว่าเปิดจาก PM Form หรือเปล่า
  var fromOpener = !!window.opener;

  // Auto-detect mode จาก URL param
  var urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('mode') === 'qr') {
    switchMode('qr');
  }

  // เตรียม canvas สำหรับสแกน (ขนาดคงที่ ไม่โตตามวิดีโอ)
  var overlay = document.getElementById('overlay');
  overlay.width  = SCAN_SIZE;
  overlay.height = SCAN_SIZE;
  var overlayCtx = overlay.getContext('2d', { willReadFrequently: true });

  // เริ่มกล้องทันที
  startCamera();

  function startCamera() {
    setStatus('กำลังเปิดกล้อง...', '');
    navigator.mediaDevices.getUserMedia({
      // ลดความละเอียดที่ขอ เพื่อให้ประมวลผลเร็วขึ้นมาก (640x480 พอสำหรับสแกน QR)
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    })
    .then(function(s) {
      stream = s;
      var v = document.getElementById('video');
      v.srcObject = s;
      v.onloadedmetadata = function() {
        v.play();
        ready = true;
        document.getElementById('snapBtn').disabled = false;
        setStatus('พร้อมใช้งาน ✅', 'ok');
        if (mode === 'qr') startQRScan();
      };
    })
    .catch(function(err) {
      setStatus('❌ เปิดกล้องไม่ได้: ' + err.message, 'error');
      document.getElementById('permGuide').style.display = 'block';
    });
  }

  function switchMode(m) {
    mode = m;
    document.getElementById('tabPhoto').className = 'tab' + (m === 'photo' ? ' active' : '');
    document.getElementById('tabQR').className    = 'tab' + (m === 'qr'    ? ' active' : '');
    document.getElementById('qrFrame').style.display  = m === 'qr' ? 'block' : 'none';
    document.getElementById('qrResult').style.display = 'none';
    document.getElementById('snapBtn').textContent    = m === 'photo' ? '📸 ถ่ายรูป' : '🔍 สแกน QR';

    if (m === 'qr' && ready) {
      startQRScan();
    } else {
      stopQRScan();
    }
  }

  // ===== ถ่ายรูป =====
  function doAction() {
    if (mode === 'photo') {
      snapPhoto();
    } else {
      // manual snap QR จาก frame ปัจจุบัน
      var result = scanFrame();
      if (result) {
        sendQR(result);
      } else {
        setStatus('ไม่พบ QR ในภาพ ลองจัดตำแหน่งใหม่', 'error');
      }
    }
  }

  function snapPhoto() {
    var v = document.getElementById('video');
    var c = document.createElement('canvas');
    c.width  = v.videoWidth  || 640;
    c.height = v.videoHeight || 480;
    c.getContext('2d').drawImage(v, 0, 0);
    var b64 = c.toDataURL('image/jpeg', 0.82);

    // ส่งกลับ opener ผ่าน postMessage
    if (window.opener) {
      window.opener.postMessage(b64, '*');
    }
    setStatus('✅ ส่งรูปสำเร็จ กำลังปิด...', 'ok');
    stopAll();
    setTimeout(function() { window.close(); }, 700);
  }

  // ===== สแกน QR (throttled + crop-on-draw เพื่อความเร็ว) =====
  function startQRScan() {
    stopQRScan();
    qrTimer = setInterval(function () {
      if (scanning) return; // ยังประมวลผลรอบก่อนหน้าไม่เสร็จ ข้ามรอบนี้ไปก่อน
      scanning = true;

      var result = scanFrame();
      if (result) {
        stopQRScan();
        sendQR(result);
      }
      scanning = false;
    }, QR_INTERVAL);
  }

  function stopQRScan() {
    if (qrTimer) {
      clearInterval(qrTimer);
      qrTimer = null;
    }
  }

  function scanFrame() {
    var v = document.getElementById('video');
    if (!v.videoWidth) return null;

    // ตัดเฉพาะพื้นที่กรอบสแกนตรงกลาง (60% ของด้านที่สั้นกว่า) แล้ววาดลง canvas เล็กทันที
    // วิธีนี้เร็วกว่าเดิมมาก เพราะไม่ต้องวาดเฟรมเต็มความละเอียดก่อนค่อยตัด
    var srcSize = Math.min(v.videoWidth, v.videoHeight) * 0.6;
    var sx = (v.videoWidth  - srcSize) / 2;
    var sy = (v.videoHeight - srcSize) / 2;

    overlayCtx.drawImage(v, sx, sy, srcSize, srcSize, 0, 0, SCAN_SIZE, SCAN_SIZE);

    var imageData = overlayCtx.getImageData(0, 0, SCAN_SIZE, SCAN_SIZE);
    var code = jsQR(imageData.data, SCAN_SIZE, SCAN_SIZE, {
      inversionAttempts: 'dontInvert' // เร็วกว่า attemptBoth ~2 เท่า ใช้พอสำหรับ QR ทั่วไปที่ไม่กลับสี
    });

    return code ? code.data : null;
  }

  function sendQR(code) {
    // ส่ง QR string กลับ opener
    if (window.opener) {
      window.opener.postMessage(code, '*');
    }
    var box = document.getElementById('qrResult');
    box.style.display = 'block';
    box.textContent = '✅ QR: ' + code;
    setStatus('ส่งข้อมูลสำเร็จ กำลังปิด...', 'ok');
    stopAll();
    setTimeout(function() { window.close(); }, 1000);
  }

  function doCancel() {
    stopAll();
    window.close();
  }

  function stopAll() {
    stopQRScan();
    if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = cls || '';
  }
</script>
</body>
</html>
